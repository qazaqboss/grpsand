<title>Путь кварцевого проппанта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* LAYOUT: одна живая площадка на весь экран; камера летит по цепочке, слева — паспорт этапа, внизу — лента из 12 этапов */
:root{
  color-scheme:dark;
  --bg:#06131d; --bg2:#0b1f2d; --glass:rgba(7,22,33,.78); --line:rgba(127,227,255,.18); --line2:rgba(127,227,255,.4);
  --ink:#e6f1f7; --mute:#8fb0c2; --soft:#c6d9e3;
  --cy:#7fe3ff; --qz:#efe2c4; --co:#ff6b57; --amb:#f2b35b; --wet:#a07a4e; --water:#3fb0dc;
  --f-disp:"Unbounded",system-ui,sans-serif; --f-body:"Golos Text",system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;min-width:0}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl.drag{cursor:grabbing}
.hud{position:fixed;z-index:10;pointer-events:none}
.hud > *{pointer-events:auto}

/* top bar */
.top{top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.brand{pointer-events:auto;display:flex;flex-direction:column;gap:2px}
.brand b{font:700 15px/1.1 var(--f-disp);letter-spacing:.01em}
.brand span{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:nowrap;justify-content:flex-end;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:40px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;font-size:13px;font-weight:500;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--line2)}
.btn:focus-visible,.step:focus-visible,.pill:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn[aria-pressed=true]{background:var(--cy);color:#04121b;border-color:var(--cy)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* phase chip */
.chip{position:fixed;z-index:10;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .4s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);flex:none;animation:pulse 1.6s infinite}
.chip em{font-style:normal;color:var(--qz);font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.35}}

/* panel */
.panel{position:fixed;z-index:10;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:min(372px,calc(100vw - 32px));
  display:flex;flex-direction:column;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.pscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 20px 18px;scrollbar-width:thin;scrollbar-color:rgba(127,227,255,.25) transparent}
.eyebrow{font:500 11px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--cy);display:flex;gap:8px;align-items:center}
.eyebrow .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--cy);font-size:11px;letter-spacing:0}
.panel h1{font:700 clamp(20px,2.2vw,25px)/1.12 var(--f-disp);margin:12px 0 10px;text-wrap:balance}
.lead{color:var(--soft);margin:0 0 14px}
.sect{font:500 11px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
.steps li{position:relative;padding-left:28px;color:var(--soft);font-size:14px;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:19px;height:19px;border-radius:6px;background:rgba(127,227,255,.12);color:var(--cy);font:600 11px/19px var(--f-body);text-align:center}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.num{padding:10px 12px;border-radius:12px;background:rgba(127,227,255,.06);border:1px solid var(--line)}
.num b{display:block;font:700 16px/1.15 var(--f-disp);color:var(--qz);font-variant-numeric:tabular-nums}
.num span{display:block;font-size:12px;color:var(--mute);margin-top:4px;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:999px;background:rgba(127,227,255,.08);color:var(--cy);border:1px solid rgba(127,227,255,.22)}
.tag.n{background:rgba(239,226,196,.07);color:var(--qz);border-color:rgba(239,226,196,.22)}
.tag.w{background:rgba(255,107,87,.1);color:var(--co);border-color:rgba(255,107,87,.3)}
.note{font-size:12.5px;color:var(--mute);margin:14px 0 0;padding:10px 12px;border-radius:10px;border-left:2px solid var(--co);background:rgba(255,107,87,.06)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.pfoot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}
.pfoot .btn{flex:1}
.pfade{animation:pf .5s ease both}
@keyframes pf{from{opacity:.0;transform:translateY(6px)}}
.ptoggle{display:none}

/* timeline */
.bar{left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:10px;align-items:center;background:linear-gradient(to top,rgba(6,19,29,.92) 40%,rgba(6,19,29,0));pointer-events:auto}
.ctrl{display:flex;gap:6px;flex:none}
.ctrl .btn{width:44px;height:44px;padding:0}
.ctrl .play{background:var(--cy);color:#04121b;border-color:var(--cy)}
.ctrl .play svg{fill:currentColor;stroke:none}
.steps-bar{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;scroll-behavior:smooth}
.steps-bar::-webkit-scrollbar{display:none}
.step{position:relative;flex:1 0 auto;min-width:88px;min-height:52px;padding:7px 10px 9px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;overflow:hidden;transition:border-color .25s,background .25s}
.step b{display:block;font:500 10.5px/1 var(--f-disp);color:var(--mute);letter-spacing:.06em}
.step span{display:block;font-size:12.5px;margin-top:5px;white-space:nowrap;color:var(--soft)}
.step::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--cy)}
.step.done{border-color:rgba(127,227,255,.3)}
.step.done b{color:var(--cy)}
.step[aria-current=step]{border-color:var(--cy);background:rgba(127,227,255,.14)}
.step[aria-current=step] b{color:var(--cy)}
.step[aria-current=step] span{color:var(--ink)}

/* labels */
#labs{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.co{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s;will-change:transform}
.co.on{opacity:1}
.co .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 0 4px rgba(127,227,255,.18),0 0 14px var(--cy)}
.co .stem{position:absolute;left:0;bottom:0;width:1px;height:34px;background:linear-gradient(to top,var(--cy),rgba(127,227,255,.2))}
.co .box{position:absolute;left:-8px;bottom:34px;transform:translateX(0);padding:6px 10px;border-radius:9px;background:rgba(6,19,29,.86);border:1px solid rgba(127,227,255,.38);white-space:nowrap;font-size:12.5px;line-height:1.3}
.co.l .box{left:auto;right:-8px}
.co .box b{display:block;color:var(--cy);font-weight:600}
.co .box small{color:var(--mute);font-size:11.5px}
.pill{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;background:rgba(6,19,29,.86);border:1px solid var(--line2);
  font-size:12.5px;white-space:nowrap;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s,border-color .2s;color:var(--ink)}
.pill.on{opacity:1;pointer-events:auto}
.pill:hover{border-color:var(--cy)}
.pill b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--cy);color:#04121b;font:600 11px var(--f-body)}
.hint{position:fixed;z-index:9;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);font-size:12px;color:var(--mute);pointer-events:none;transition:opacity .6s}

@media (max-width:760px){
  .brand span{display:none}
  .tools .lbl{display:none}
  .chip{top:calc(env(safe-area-inset-top,0px) + 62px);font-size:12px}
  html,body{height:auto;min-height:100%}
  body{overflow-x:hidden;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
  #gl{touch-action:pan-y}
  .panel{position:relative;top:auto;bottom:auto;left:auto;width:auto;margin:calc(env(safe-area-inset-top,0px) + 64vh) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));border-radius:16px;overflow:visible}
  .panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 0}
  .pscroll{overflow:visible;padding:12px 16px 18px}
  .panel h1{font-size:18px;margin:8px 0 6px}
  .lead{font-size:14px;margin-bottom:8px}
  .pfoot{display:none}
  .bar{padding-top:8px;gap:8px}
  .ctrl .btn{width:40px;height:40px}
  .ctrl .prev,.ctrl .next{display:none}
  .step{min-width:74px;min-height:46px;padding:6px 8px 8px}
  .step span{font-size:11.5px}
  .hint{display:none}
  .co .box{font-size:11px;padding:4px 8px}
  .co .box small{display:none}
  .co .stem{height:22px}.co .box{bottom:22px}
}
@media (prefers-reduced-motion:reduce){.chip i{animation:none}.pfade{animation:none}}
</style>

<canvas id="gl" tabindex="0" aria-label="3D-модель цепочки производства проппанта. Тяните, чтобы повернуть, колесо или щипок — масштаб."></canvas>
<div id="labs" aria-hidden="true"></div>

<header class="hud top">
  <div class="brand"><b>Путь кварцевого проппанта</b><span>от пласта до трещины ГРП</span></div>
  <div class="tools">
    <button class="btn" id="bOver" aria-pressed="false" title="Вся цепочка сверху (O)"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg><span class="lbl">Вся цепочка</span></button>
    <button class="btn" id="bSpeed" title="Скорость анимации">1×</button>
    <button class="btn" id="bFull" title="Во весь экран (F)" aria-label="Во весь экран"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<div class="chip" id="chip"><i></i><span id="chipT">Загрузка сцены…</span></div>

<aside class="panel" id="panel" aria-live="polite">
  <button class="btn ptoggle" id="bMin" aria-expanded="true">Свернуть</button>
  <div class="pscroll" id="pbody"></div>

    <button class="btn" id="bPrev2">← Назад</button>
    <button class="btn" id="bNext2">Дальше →</button>
  </div>
</aside>

<div class="hint" id="hint">Тяните — поворот · колесо — масштаб · ← → — этапы</div>

<nav class="hud bar" aria-label="Этапы цепочки">
  <div class="ctrl">
    <button class="btn prev" id="bPrev" aria-label="Предыдущий этап"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>

    <button class="btn next" id="bNext" aria-label="Следующий этап"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="steps-bar" id="stepsBar"></div>
</nav>

  m.position.set(x,-32,0);m.rotation.y=Math.PI/2;g.add(m);const rimG=new THREE.BufferGeometry().setFromPoints(Array.from({length:65},(_,i)=>{const a=i/64*Math.PI*2;return new THREE.Vector3(Math.cos(a),Math.sin(a),0);}));
  const rimL=new THREE.Line(rimG,new THREE.LineBasicMaterial({color:CY,transparent:true,opacity:.8}));m.add(rimL);FRS.push(m);
  const p=pts(NP,.2);const a=p.geometry.attributes.position.array,c=p.geometry.attributes.color.array;const arr=[];for(let i=0;i<NP;i++){const r=Math.sqrt(hash(i*3.1+j));const an=hash(i*7.7+j*3)*6.28;arr.push([r,an]);}arr.sort((A,B)=>A[0]-B[0]);
  arr.forEach(([r,an],i)=>{setP(a,i,x+(hash(i+j)-.5)*.3,-32+Math.sin(an)*r*4.3,Math.cos(an)*r*9.2);setC(c,i,r>.82?COL.f3:COL.qz.clone().lerp(COL.f2,hash(i)*.4));});
  p.geometry.setDrawRange(0,0);PROP.push(p);});
 // нефть
 const NO=360,oil=pts(NO,.26,{add:true});const oa=oil.geometry.attributes.position.array,oc=oil.geometry.attributes.color.array;const OS=[];
 for(let i=0;i<NO;i++){const j=i%4,r=Math.sqrt(hash(i*1.3))*.95,an=hash(i*2.9)*6.28;OS.push([j,Math.sin(an)*r*4.3,Math.cos(an)*r*9.2,hash(i*5.1)]);setC(oc,i,COL.oil);}
 const dEnt=FX.map(x=>{let best=0,bd=1e9;for(let i=0;i<wp.P.length;i++){const dd=Math.abs(wp.P[i].x-x)+Math.abs(wp.P[i].y+32);if(dd<bd){bd=dd;best=wp.L[i];}}return best;});
 // стрелки давления смыкания
 const arrows=[];[1,-1].forEach(s=>{const ag=new THREE.Group();const sh=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,2.4,10),CORM);const hd=new THREE.Mesh(new THREE.ConeGeometry(.5,1,12),CORM);hd.position.y=-1.6;hd.rotation.x=Math.PI;ag.add(sh,hd);ag.rotation.z=s>0?0:Math.PI;ag.userData.s=s;g.add(ag);arrows.push(ag);});
 const inj=flow(wp,160,14,.26,(d,i,v,t)=>{const [,c]=fracPhase(t%FRAC_T);return hash(i)<c/650?COL.qz:COL.water;},.12);
 ups.push(t=>{const u=t%FRAC_T;inj.on=u<13.5;
  FRS.forEach((m,j)=>{const ord=3-j;const s=u<13.5?sm((u-.4-ord*.7)/1.4):1;let sc=.04+.96*s;m.scale.set(9.2*sc,4.3*sc,1);
   m.material.opacity=u<13.5?.24:lerp(.24,.08,sm((u-13.5)/1.5));m.material.color.setHex(u<13.5?CY:0xbfe8f2);
   const pr=u<15?clamp((u-3-ord*.45)/8,0,1):1;PROP[j].geometry.setDrawRange(0,Math.floor(NP*pr*s));});
  arrows.forEach(a=>{const vis=u>13.2&&u<16.2;a.visible=vis;const k=sm((u-13.2)/1.4);a.position.set(136,-32+a.userData.s*(8.2-k*2.4),9.8);});
  oil.visible=u>=15;if(u>=15){const k=(u-15)/5;for(let i=0;i<NO;i++){const [j,y0,z0,ph]=OS[i];const p=(k*1.4+ph)%1;let x,y,z;
    if(p<.5){const q=sm(p/.5);x=FX[j];y=-32+y0*(1-q);z=z0*(1-q);}else{const q=(p-.5)/.5;at(wp,dEnt[j]-q*(dEnt[j]*.55),V);x=V.x;y=V.y;z=V.z;}
    setP(oa,i,x,y,z);}oil.geometry.attributes.position.needsUpdate=true;}});
}

/* ================= КАМЕРА ================= */
const camS={t:new THREE.Vector3(0,0,0),r:240,th:.16,ph:.8};
let tw=null,cur=-1,playing=!RM,SPEED=1,dwell=0,DWELL=15,dragging=false,userTouched=false;
const rf=()=>{const a=innerWidth/innerHeight;return a<.75?1.75:a<1.1?1.35:1;};
function fly(k,dur){const to={t:new THREE.Vector3(k[0],k[1],k[2]),r:k[3]*rf(),th:k[4],ph:k[5]};const from={t:camS.t.clone(),r:camS.r,th:camS.th,ph:camS.ph};
 let d=to.th-from.th;d=Math.atan2(Math.sin(d),Math.cos(d));to.th=from.th+d;const dist=from.t.distanceTo(to.t);
 tw={from,to,s:performance.now(),dur:(RM?.6:dur||Math.min(4.2,2+dist/60))*1000,bump:Math.min(dist*.4,60)};}
function stepCam(dt){if(tw){const e=clamp((performance.now()-tw.s)/tw.dur,0,1),k=ease(e),f=tw.from,o=tw.to,b=Math.sin(Math.PI*k);
  camS.t.lerpVectors(f.t,o.t,k);camS.r=lerp(f.r,o.r,k)+b*tw.bump;camS.th=lerp(f.th,o.th,k);camS.ph=lerp(f.ph,o.ph,k)-b*Math.min(.25,tw.bump/240);if(e>=1)tw=null;}
 else if(playing&&!dragging&&!RM){camS.th+=dt*.022;}
 const sp=Math.sin(camS.ph);cam.position.set(camS.t.x+camS.r*sp*Math.sin(camS.th),camS.t.y+camS.r*Math.cos(camS.ph),camS.t.z+camS.r*sp*Math.cos(camS.th));cam.lookAt(camS.t);
 scene.fog.density=.5/Math.max(camS.r,22);}

/* ================= ИНТЕРФЕЙС ================= */
const $=id=>document.getElementById(id);
const pbody=$('pbody'),panel=$('panel'),bar=$('stepsBar'),chipT=$('chipT'),labsEl=$('labs');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
STAGES.forEach((s,i)=>{const b=document.createElement('button');b.className='step';b.type='button';b.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b><span>${esc(s.n)}</span>`;b.addEventListener('click',()=>{go(i);});bar.appendChild(b);s.btn=b;});
// выноски
STAGES.forEach((s,i)=>{s.lab=s.labs.map(([p,t,sub])=>{const d=document.createElement('div');d.className='co';d.innerHTML=`<i class="dot"></i><i class="stem"></i><div class="box"><b>${esc(t)}</b><small>${esc(sub)}</small></div>`;labsEl.appendChild(d);return{el:d,p:new THREE.Vector3(...p)};});
 const pl=document.createElement('button');pl.className='pill';pl.type='button';pl.innerHTML=`<b>${i+1}</b>${esc(s.n)}`;pl.addEventListener('click',()=>go(i));labsEl.appendChild(pl);s.pill={el:pl,p:new THREE.Vector3(...s.mark)};});

function renderPanel(i){let h;
 if(i<0){h=`<div class="eyebrow"><span class="n">∑</span>Обзор · 12 этапов</div><h1>${OVER.title}</h1><p class="lead">${OVER.lead}</p>
  <div class="more"><div class="sect">Что течёт по линиям</div><div class="legend">${OVER.legend.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>
  <div class="sect">Маршрут</div><ol class="steps">${STAGES.map(s=>`<li>${esc(s.title)}</li>`).join('')}</ol>
  <p class="note" style="border-left-color:var(--cy);background:rgba(127,227,255,.06)">Схема условная: состав и число аппаратов зависят от сырья месторождения. Нормы — по ISO 13503-2 и API RP 19C; пределы раздавливания даны как ориентир по API RP 56.</p></div>`;}
 else{const s=STAGES[i];h=`<div class="eyebrow"><span class="n">${i+1}</span>Этап ${i+1} из ${STAGES.length}</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p>
  <div class="more"><div class="sect">Что происходит</div><ol class="steps">${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
  <div class="sect">Цифры</div><div class="nums">${s.nums.map(([v,l])=>`<div class="num"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
  <div class="sect">Что измеряют</div><div class="tags">${s.data.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
  <div class="sect">Что нужно</div><div class="tags">${s.need.map(x=>`<span class="tag n">${esc(x)}</span>`).join('')}</div>
  ${s.note?`<p class="note">${esc(s.note)}</p>`:''}</div>`;}
 pbody.innerHTML=`<div class="pfade">${h}</div>`;pbody.scrollTop=0;}

function go(i,o){o=o||{};if(i>=STAGES.length)i=-1;cur=i;dwell=0;
 fly(i<0?OVER.cam:STAGES[i].cam,o.dur);renderPanel(i);
 STAGES.forEach((s,k)=>{s.btn.setAttribute('aria-current',k===i?'step':'false');s.btn.classList.toggle('done',i>=0&&k<i);s.btn.style.setProperty('--p',k<i&&i>=0?1:0);});
 $('bOver').setAttribute('aria-pressed',String(i<0));
 if(i>=0){const b=STAGES[i].btn;bar.scrollTo({left:b.offsetLeft-bar.clientWidth/2+b.offsetWidth/2,behavior:RM?'auto':'smooth'});}
 try{history.replaceState(null,'',i<0?'#obzor':'#etap-'+(i+1));}catch(e){}}
function setPlay(p){playing=p;$('bPlay').setAttribute('aria-label',p?'Пауза':'Смотреть тур');$('playIco').innerHTML=p?'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>':'<path d="M7 4l13 8-13 8z"/>';}
$('bPlay').onclick=()=>{setPlay(!playing);if(playing&&!tw)dwell=Math.min(dwell,DWELL-1);};
const prev=()=>go(cur<=0?(cur<0?STAGES.length-1:-1):cur-1), next=()=>go(cur+1);
$('bPrev').onclick=prev;$('bNext').onclick=next;$('bPrev2').onclick=prev;$('bNext2').onclick=next;
$('bOver').onclick=()=>go(-1);
const SPEEDS=[1,2,.5];$('bSpeed').onclick=()=>{SPEED=SPEEDS[(SPEEDS.indexOf(SPEED)+1)%3];$('bSpeed').textContent=(SPEED===.5?'0,5':SPEED)+'×';};
$('bFull').onclick=()=>{const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else{const p=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(e){}};
$('bMin').onclick=()=>{const m=panel.classList.toggle('min');$('bMin').textContent=m?'Подробнее':'Свернуть';$('bMin').setAttribute('aria-expanded',String(!m));resize();};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){next();}else if(e.key==='ArrowLeft'){prev();}else if(e.key===' '&&e.target===document.body||e.key===' '&&e.target===canvas){e.preventDefault();$('bPlay').click();}else if(e.key==='o'||e.key==='щ'){go(-1);}else if(e.key==='f'||e.key==='а'){$('bFull').click();}});

/* управление камерой */
const ptrs=new Map();let pinch0=0,r0=0,moved=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);r0=camS.r;}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 if(moved>4&&!dragging){dragging=true;canvas.classList.add('drag');tw=null;if(playing)setPlay(false);userTouched=true;$('hint').style.opacity=0;}
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)camS.r=clamp(r0*pinch0/d,8,340);return;}
 if(dragging){camS.th-=dx*.0055;if(e.pointerType!=='touch')camS.ph=clamp(camS.ph-dy*.0045,.18,cur===11?1.75:1.52);}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(!ptrs.size){dragging=false;canvas.classList.remove('drag');}};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();tw=null;camS.r=clamp(camS.r*Math.exp(e.deltaY*.0012),8,340);},{passive:false});

/* размер и смещение кадра под панель */
let W=0,Hh=0;
function resize(){W=innerWidth;Hh=innerHeight;renderer.setSize(W,Hh,false);cam.aspect=W/Hh;
 const pr=panel.getBoundingClientRect();let ox=0,oy=0;
 if(W>760){ox=-(pr.right+8)/2;}else{oy=Hh*.15;}
 cam.setViewOffset(W,Hh,ox,oy,W,Hh);cam.updateProjectionMatrix();}
addEventListener('resize',resize);

/* выноски */
const PV=new THREE.Vector3();
function proj(p){PV.copy(p).project(cam);return{x:(PV.x*.5+.5)*W,y:(-PV.y*.5+.5)*Hh,ok:PV.z<1&&PV.z>-1};}
function updLabels(){const show=!tw;STAGES.forEach((s,i)=>{const act=i===cur&&show;s.lab.forEach(l=>{if(!act){l.el.classList.remove('on');return;}const q=proj(l.p);const vis=q.ok&&q.x>10&&q.x<W-10&&q.y>120&&q.y<Hh-90;l.el.classList.toggle('on',vis);l.el.classList.toggle('l',q.x>W*.72);l.el.style.transform=`translate(${q.x.toFixed(1)}px,${q.y.toFixed(1)}px)`;});
  const po=cur<0&&show;const q=proj(s.pill.p);s.pill.el.classList.toggle('on',po&&q.ok);if(po)s.pill.el.style.transform=`translate(${q.x.toFixed(1)}px,${q.y.toFixed(1)}px) translate(-50%,-100%)`;});}

/* подсветка активного этапа */
function updHi(dt){G.forEach((g,i)=>{const tgt=cur<0?.5:i===cur?.95:.18;const m=g.userData.lm;m.opacity+= (tgt-m.opacity)*Math.min(1,dt*3);});}

/* фаза */
let lastChip='';
function updChip(t){let s;if(cur===10||cur===11){const [ph,c]=fracPhase(t%FRAC_T);s=`<span>${ph}</span>`+(c?` · <em>песок ~${c} кг/м³</em>`:'');}
 else if(cur<0)s='<span>Весь цикл: 12 этапов, от недр до трещины</span>';else s=`<span>${STAGES[cur].state}</span>`;if(s!==lastChip){chipT.innerHTML=s;lastChip=s;}}

/* цикл */
const clock=new THREE.Clock();let T=0;
function frame(){const dt=Math.min(clock.getDelta(),.05);const sdt=RM?dt*.4:dt*SPEED;T+=sdt;
 for(let i=0;i<ups.length;i++)ups[i](T,sdt);
 stepCam(dt);updHi(dt);
 if(playing&&!tw){dwell+=dt*SPEED;if(cur>=0)STAGES[cur].btn.style.setProperty('--p',clamp(dwell/DWELL,0,1).toFixed(3));if(dwell>=(cur<0?8:DWELL))go(cur+1);}
 updChip(T);renderer.render(scene,cam);updLabels();requestAnimationFrame(frame);}

resize();
const hs=location.hash.match(/^#etap-(\d+)$/);
if(hs){const i=clamp(+hs[1]-1,0,STAGES.length-1);const k=STAGES[i].cam;camS.t.set(k[0],k[1],k[2]);camS.r=k[3]*rf()*1.6;camS.th=k[4]-.6;camS.ph=k[5]-.2;go(i);}
else{camS.t.set(OVER.cam[0],OVER.cam[1],OVER.cam[2]);camS.r=OVER.cam[3]*rf()*1.25;camS.th=OVER.cam[4]-.5;camS.ph=OVER.cam[5]-.25;go(-1,{dur:3.4});dwell=0;}
setPlay(playing);
requestAnimationFrame(frame);
})();
</script>
