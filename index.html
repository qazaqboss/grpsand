<title>Путь кварцевого проппанта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* LAYOUT: одна живая площадка на весь экран; камера летит по цепочке, слева — паспорт этапа, внизу — лента из 12 этапов */
:root{
  color-scheme:dark;
  --bg:#06131d; --bg2:#0b1f2d; --glass:rgba(7,22,33,.78); --line:rgba(127,227,255,.18); --line2:rgba(127,227,255,.4);
  --ink:#e6f1f7; --mute:#8fb0c2; --soft:#c6d9e3;
  --cy:#7fe3ff; --qz:#efe2c4; --co:#ff6b57; --amb:#f2b35b; --wet:#a07a4e; --water:#3fb0dc;
  --f-disp:"Unbounded",system-ui,sans-serif; --f-body:"Golos Text",system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;min-width:0}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl.drag{cursor:grabbing}
.hud{position:fixed;z-index:10;pointer-events:none}
.hud > *{pointer-events:auto}

/* top bar */
.top{top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.brand{pointer-events:auto;display:flex;flex-direction:column;gap:2px}
.brand b{font:700 15px/1.1 var(--f-disp);letter-spacing:.01em}
.brand span{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:nowrap;justify-content:flex-end;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:40px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;font-size:13px;font-weight:500;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--line2)}
.btn:focus-visible,.step:focus-visible,.pill:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn[aria-pressed=true]{background:var(--cy);color:#04121b;border-color:var(--cy)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* phase chip */
.chip{position:fixed;z-index:10;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .4s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);flex:none;animation:pulse 1.6s infinite}
.chip em{font-style:normal;color:var(--qz);font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.35}}

/* panel */
.panel{position:fixed;z-index:10;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:min(372px,calc(100vw - 32px));
  display:flex;flex-direction:column;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.pscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 20px 18px;scrollbar-width:thin;scrollbar-color:rgba(127,227,255,.25) transparent}
.eyebrow{font:500 11px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--cy);display:flex;gap:8px;align-items:center}
.eyebrow .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--cy);font-size:11px;letter-spacing:0}
.panel h1{font:700 clamp(20px,2.2vw,25px)/1.12 var(--f-disp);margin:12px 0 10px;text-wrap:balance}
.lead{color:var(--soft);margin:0 0 14px}
.sect{font:500 11px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
.steps li{position:relative;padding-left:28px;color:var(--soft);font-size:14px;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:19px;height:19px;border-radius:6px;background:rgba(127,227,255,.12);color:var(--cy);font:600 11px/19px var(--f-body);text-align:center}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.num{padding:10px 12px;border-radius:12px;background:rgba(127,227,255,.06);border:1px solid var(--line)}
.num b{display:block;font:700 16px/1.15 var(--f-disp);color:var(--qz);font-variant-numeric:tabular-nums}
.num span{display:block;font-size:12px;color:var(--mute);margin-top:4px;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:999px;background:rgba(127,227,255,.08);color:var(--cy);border:1px solid rgba(127,227,255,.22)}
.tag.n{background:rgba(239,226,196,.07);color:var(--qz);border-color:rgba(239,226,196,.22)}
.tag.w{background:rgba(255,107,87,.1);color:var(--co);border-color:rgba(255,107,87,.3)}
.note{font-size:12.5px;color:var(--mute);margin:14px 0 0;padding:10px 12px;border-radius:10px;border-left:2px solid var(--co);background:rgba(255,107,87,.06)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.pfoot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}
.pfoot .btn{flex:1}
.pfade{animation:pf .5s ease both}
@keyframes pf{from{opacity:.0;transform:translateY(6px)}}
.ptoggle{display:none}

/* timeline */
.bar{left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:10px;align-items:center;background:linear-gradient(to top,rgba(6,19,29,.92) 40%,rgba(6,19,29,0));pointer-events:auto}
.ctrl{display:flex;gap:6px;flex:none}
.ctrl .btn{width:44px;height:44px;padding:0}
.ctrl .play{background:var(--cy);color:#04121b;border-color:var(--cy)}
.ctrl .play svg{fill:currentColor;stroke:none}
.steps-bar{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;scroll-behavior:smooth}
.steps-bar::-webkit-scrollbar{display:none}
.step{position:relative;flex:1 0 auto;min-width:88px;min-height:52px;padding:7px 10px 9px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;overflow:hidden;transition:border-color .25s,background .25s}
.step b{display:block;font:500 10.5px/1 var(--f-disp);color:var(--mute);letter-spacing:.06em}
.step span{display:block;font-size:12.5px;margin-top:5px;white-space:nowrap;color:var(--soft)}
.step::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--cy)}
.step.done{border-color:rgba(127,227,255,.3)}
.step.done b{color:var(--cy)}
.step[aria-current=step]{border-color:var(--cy);background:rgba(127,227,255,.14)}
.step[aria-current=step] b{color:var(--cy)}
.step[aria-current=step] span{color:var(--ink)}

/* labels */
#labs{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.co{position:absolute;left:0;top:0;opacity:0;transition:opacity .45s;will-change:transform}
.co.on{opacity:1}
.co .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 0 4px rgba(127,227,255,.18),0 0 14px var(--cy)}
.co .stem{position:absolute;left:0;bottom:0;width:1px;height:34px;background:linear-gradient(to top,var(--cy),rgba(127,227,255,.2))}
.co .box{position:absolute;left:-8px;bottom:34px;transform:translateX(0);padding:6px 10px;border-radius:9px;background:rgba(6,19,29,.86);border:1px solid rgba(127,227,255,.38);white-space:nowrap;font-size:12.5px;line-height:1.3}
.co.l .box{left:auto;right:-8px}
.co .box b{display:block;color:var(--cy);font-weight:600}
.co .box small{color:var(--mute);font-size:11.5px}
.pill{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;background:rgba(6,19,29,.86);border:1px solid var(--line2);
  font-size:12.5px;white-space:nowrap;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .45s,border-color .2s;color:var(--ink)}
.pill.on{opacity:1;pointer-events:auto}
.pill:hover{border-color:var(--cy)}
.pill b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--cy);color:#04121b;font:600 11px var(--f-body)}
.modes{pointer-events:auto;display:flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-right:auto;margin-left:18px}
.modes button{border:0;background:transparent;min-height:36px;padding:0 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;color:var(--soft);white-space:nowrap}
.modes button[aria-selected=true]{background:var(--qz);color:#04121b}
.modes button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.modes .sh{display:none}
.chart{margin:4px 0 6px;padding:10px 10px 8px;border-radius:12px;border:1px solid var(--line);background:rgba(4,14,21,.55)}
.chart canvas{display:block;width:100%;height:110px}
.chl{display:flex;gap:12px;font-size:11.5px;color:var(--mute);margin-bottom:6px}
.chl span{display:flex;align-items:center;gap:5px}.chl span::before{content:"";width:12px;height:2px;border-radius:1px;background:var(--c)}
.chn{font-size:11px;color:var(--mute);margin-top:4px}
.cta{width:100%;margin-top:16px;min-height:44px;background:rgba(239,226,196,.1);border-color:rgba(239,226,196,.35);color:var(--qz)}
.hint{position:fixed;z-index:9;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);font-size:12px;color:var(--mute);pointer-events:none;transition:opacity .6s}

@media (max-width:760px){
  .brand{display:none}
  .modes{margin-left:0}
  .modes .full{display:none}.modes .sh{display:inline}
  .tools .lbl{display:none}
  .chip{top:calc(env(safe-area-inset-top,0px) + 62px);font-size:12px}
  html,body{height:auto;min-height:100%}
  body{overflow-x:hidden;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
  #gl{touch-action:pan-y}
  .panel{position:relative;top:auto;bottom:auto;left:auto;width:auto;margin:calc(env(safe-area-inset-top,0px) + 64vh) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));border-radius:16px;overflow:visible}
  .panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:10px auto 0}
  .pscroll{overflow:visible;padding:12px 16px 18px}
  .panel h1{font-size:18px;margin:8px 0 6px}
  .lead{font-size:14px;margin-bottom:8px}
  .pfoot{display:none}
  .bar{padding-top:8px;gap:8px}
  .ctrl .btn{width:40px;height:40px}
  .ctrl .prev,.ctrl .next{display:none}
  .step{min-width:74px;min-height:46px;padding:6px 8px 8px}
  .step span{font-size:11.5px}
  .hint{display:none}
  .co .box{font-size:11px;padding:4px 8px}
  .co .box small{display:none}
  .co .stem{height:22px}.co .box{bottom:22px}
}
@media (prefers-reduced-motion:reduce){.chip i{animation:none}.pfade{animation:none}}
</style>

<canvas id="gl" tabindex="0" aria-label="3D-модель цепочки производства проппанта. Тяните, чтобы повернуть, колесо или щипок — масштаб."></canvas>
<div id="labs" aria-hidden="true"></div>

<header class="hud top">
  <div class="brand"><b>Путь кварцевого проппанта</b><span>от карьера до скважины</span></div>
  <div class="modes" role="tablist" aria-label="Раздел">
    <button type="button" role="tab" data-m="pesok" aria-selected="true"><span class="full">Производство песка</span><span class="sh">Песок</span></button>
    <button type="button" role="tab" data-m="grp" aria-selected="false"><span class="full">ГРП на скважине</span><span class="sh">ГРП</span></button>
  </div>
  <div class="tools">
    <button class="btn" id="bOver" aria-pressed="false" title="Вся цепочка сверху (O)"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg><span class="lbl">Вся цепочка</span></button>
    <button class="btn" id="bSpeed" title="Скорость анимации">1×</button>
    <button class="btn" id="bFull" title="Во весь экран (F)" aria-label="Во весь экран"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<div class="chip" id="chip"><i></i><span id="chipT">Загрузка сцены…</span></div>

<aside class="panel" id="panel" aria-live="polite">
  <button class="btn ptoggle" id="bMin" aria-expanded="true">Свернуть</button>
  <div class="pscroll" id="pbody"></div>
  <div class="pfoot">
    <button class="btn" id="bPrev2">← Назад</button>
    <button class="btn" id="bNext2">Дальше →</button>
  </div>
</aside>

<div class="hint" id="hint">Тяните — поворот · колесо — масштаб · ← → — этапы</div>

<nav class="hud bar" aria-label="Этапы цепочки">
  <div class="ctrl">
    <button class="btn prev" id="bPrev" aria-label="Предыдущий этап"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="btn play" id="bPlay" aria-label="Пауза"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg></button>
    <button class="btn next" id="bNext" aria-label="Следующий этап"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="steps-bar" id="stepsBar"></div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

 S.forEach(([f,c])=>{for(const past of [false,true]){x.beginPath();x.strokeStyle=c.trim();x.globalAlpha=past?1:.22;x.lineWidth=past?2:1.5;let first=true;const e=past?Math.min(now,t1):t1;
   for(let t=t0;t<=e;t+=.12){const v=f(t);if(first){x.moveTo(X(t),Y(v));first=false;}else x.lineTo(X(t),Y(v));}x.stroke();}});x.globalAlpha=1;
 if(now<t1&&now>t0){x.strokeStyle='#e6f1f7';x.lineWidth=1;x.beginPath();x.moveTo(X(now),4);x.lineTo(X(now),h-4);x.stroke();x.fillStyle='#ff6b57';x.beginPath();x.arc(X(now),Y(presF(now)),3.2,0,7);x.fill();}}

/* цикл */
const clock=new THREE.Clock();let T=0;
function frame(){const dt=Math.min(clock.getDelta(),.05);const sdt=RM?dt*.4:dt*SPEED;T+=sdt;const w=MODE.w;
 if(MODE.key==='grp'){JT+=sdt;if(cur>=0){const [a,b]=MODE.stages[cur].win;if(JT>=b){if(playing&&!dragging){go(cur+1);}else JT=a+((JT-b)%(b-a));}
   if(cur>=0){const [a2,b2]=MODE.stages[cur].win;MODE.stages[cur].btn.style.setProperty('--p',clamp((JT-a2)/(b2-a2),0,1).toFixed(3));}}else if(JT>=JEND)JT=0;}
 for(let i=0;i<w.ups.length;i++)w.ups[i](T,sdt);
 stepCam(dt);updHi(dt);
 if(playing&&!tw){dwell+=dt*SPEED;if(MODE.key!=='grp'&&cur>=0)STAGES[cur].btn.style.setProperty('--p',clamp(dwell/DWELL,0,1).toFixed(3));
  if(cur<0&&dwell>=(MODE.key==='grp'?14:8))go(0);else if(MODE.key!=='grp'&&cur>=0&&dwell>=DWELL)go(cur+1);}
 updChip();drawChart();renderer.render(w.scene,cam);updLabels();requestAnimationFrame(frame);}

resize();
let hm=location.hash.match(/^#(pesok|grp)(?:-(\d+))?$/),leg=location.hash.match(/^#etap-(\d+)$/);
if(hm){const md=MODES[hm[1]];setMode(hm[1],hm[2]?clamp(+hm[2]-1,0,md.stages.length-1):-1,true);}
else if(leg&&+leg[1]<=STAGES.length)setMode('pesok',+leg[1]-1,true);
else setMode('pesok',-1,true);
setPlay(playing);
requestAnimationFrame(frame);
})();
